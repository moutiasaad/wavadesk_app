name: wavadesk
description: "Wavadesk Agent — unified support inbox"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  lucide_icons_flutter: ^3.1.15
  shared_preferences: ^2.5.3
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.2
  http: ^1.6.0
  connectivity_plus: ^6.1.4
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  flutter_svg: ^2.3.0
  clock: ^1.1.2
  flutter_slidable: ^4.0.3
  crypto: ^3.0.8
  uuid: ^4.6.0
  http_parser: ^4.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^19.4.0
  qr_flutter: ^4.1.0
  file_picker: ^11.0.3
  simple_icons: ^16.23.0
  record: ^6.2.1
  just_audio: ^0.10.6
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/config/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400

# App icon = the web favicon (public/images/wavadesk-icon.svg in the Laravel
# app). Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 24
